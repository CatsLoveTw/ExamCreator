name: Run Exam Parser Catcher

# 保證任何時刻只有一個 Parser 正在執行
concurrency:
  group: exam-parser-exclusive-singleton
  cancel-in-progress: false

on:
  schedule:
    # 保底心跳機制（每 6 小時一次）：防止網路異常斷掉接力時，系統能自動重新開機喚醒
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支援手動在 GitHub 網頁點擊執行
    inputs:
      repair_only:
        description: '⚡ 【秒級修復】僅執行 100+ 份資料庫離線清洗（剔除幽靈題、合併重題、升級知識點，修復後直接上傳，不跑 catcher.py）'
        required: false
        type: boolean
        default: false
      process_reported_tickets_only:
        description: '🎯 【精準重跑】僅針對使用者在網頁回報有問題的題目進行重新檢驗、重新裁圖與 AI 重解'
        required: false
        type: boolean
        default: false

      run_repair_before_parse:
        description: '🧹 【修復+續跑】先執行資料庫離線修復，再啟動 catcher.py 進行新題目解析'
        required: false
        type: boolean
        default: false
      refresh_diagrams:
        description: '🔄 是否強制重繪所有 AI 圖解 (修復舊版中文豆腐塊與細長條變形)'
        required: false
        type: boolean
        default: false

jobs:
  run-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Job 層級安全超時保護 (5.8小時)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies & rclone
        run: |
          # 一次性安裝中文字型、字型管理工具、curl、zip 與 unzip
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fontconfig curl zip unzip
          sudo fc-cache -fv
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai openai httpx pymupdf pillow matplotlib pydantic opencc-python-reimplemented
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Configure rclone & Gemini Keys
        env:
          GEMINI_API_KEYS_ENV: ${{ secrets.GEMINI_API_KEYS }}
          GDRIVE_OAUTH_TOKEN_ENV: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          GEMINI_PROXY_URL: ${{ secrets.GEMINI_PROXY_URL }}
        run: |
          # 1. 將 Gemini 金鑰寫入本地 key.txt
          printf "%s\n" "$GEMINI_API_KEYS_ENV" > key.txt
          
          # 2. 自動產生 rclone 設定檔
          cat << EOF > rclone.conf
          [gdrive]
          type = drive
          scope = drive
          token = $GDRIVE_OAUTH_TOKEN_ENV
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF

      - name: Pull Workspace from Google Drive (雙軌智慧拉取模式)
        run: |
          echo "⬇️ 開始從 Google Drive 雲端同步最新進度與題庫..."
          mkdir -p gdrive_workspace
          
          # =========================================================================
          # 🚀 第一步：優先抓取根目錄的高速壓縮包與狀態檔（秒級完成核心數據恢復）
          # =========================================================================
          rclone copy gdrive: ./gdrive_workspace \
            --include "exam_databases.zip" \
            --include "exam_images.zip" \
            --include "*.zip" \
            --include "*.json" \
            --include "key_status.txt" \
            --include "key_errors_summary.txt" \
            --fast-list \
            --config rclone.conf -v || true

          # 1. 解壓縮原始考卷題庫壓縮包 (exams.zip, mock.zip, full.zip, school.zip)
          for zipfile in exams.zip mock.zip full.zip school.zip; do
            if [ -f "./gdrive_workspace/$zipfile" ]; then
              echo "📦 找到題庫 $zipfile，正在解壓縮..."
              unzip -q -o "./gdrive_workspace/$zipfile" -d ./
            fi
          done

          # 2. ⚡ 優先解壓 exam_databases.zip 高速題庫包（瞬間恢復所有已完成的 JSON）
          mkdir -p exam_database_output
          if [ -f "./gdrive_workspace/exam_databases.zip" ]; then
            echo "⚡ 找到題庫高速包 exam_databases.zip，正在秒級解壓縮..."
            unzip -q -o "./gdrive_workspace/exam_databases.zip" -d ./
            echo "✅ 題庫資料庫已瞬間恢復完成！"
          fi

          # 3. ⚡ 優先解壓 exam_images.zip 圖片高速包
          if [ -f "./gdrive_workspace/exam_images.zip" ]; then
            echo "⚡ 找到圖片高速包 exam_images.zip，正在秒級解壓縮..."
            unzip -q -o "./gdrive_workspace/exam_images.zip" -d ./
            echo "✅ 圖片庫已瞬間恢復完成！"
          fi

          # =========================================================================
          # 🔄 第二步：啟動「增量補足機制」，透過 rclone 確保雲端上任何殘留的 partial、
          #           新生成的散裝 JSON 或漏掉的圖片能被精準補齊到本地工作區
          # =========================================================================
          echo "🔄 正在從雲端增量同步並補足任何散裝、partial 檔案..."
          rclone copy gdrive:exam_database_output ./exam_database_output \
            --fast-list \
            --transfers 16 \
            --checkers 32 \
            --config rclone.conf -v || true
          
          # 4. 精準還原知識庫與狀態記憶庫
          cp -f ./gdrive_workspace/subject.json ./subject.json 2>/dev/null || true
          cp -f ./gdrive_workspace/key_errors_summary.txt ./key_errors_summary.txt 2>/dev/null || true
          cp -f ./gdrive_workspace/model_limits.json ./model_limits.json 2>/dev/null || true
          cp -f ./gdrive_workspace/key_status.txt ./key_status.txt 2>/dev/null || true
          cp -f ./gdrive_workspace/telemetry_history.json ./telemetry_history.json 2>/dev/null || true
          if [ ! -f "./model_limits.json" ]; then echo "{}" > ./model_limits.json; fi

      - name: 🛠️ 執行資料庫離線無損修復與重漏題仲裁
        run: |
          echo "=========================================================="
          echo "🚀 啟動 100+ 份試卷資料庫離線無損修復引擎 (Zero-API Cost)..."
          echo "=========================================================="
          # 🚨 預先清理 Google Drive 下載產生的 .1.json / .2.json 同名衝突副本
          find ./exam_database_output -name "*_database.*.json" -type f -delete
          python repair_database.py
          find ./exam_database_output -name "*.bak" -type f -delete
          echo "✅ 資料庫洗淨與修復完畢，已就緒！"

      - name: 🌐 啟動 Cloudflare Tunnel 即時儀表板穿透
        if: ${{ github.event.inputs.repair_only != 'true' }}
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb && rm cloudflared.deb
          
          # 背景啟動穿透通道，對接本機 8080 遙測儀表板
          cloudflared tunnel --url http://127.0.0.1:8080 > cloudflare_tunnel.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' cloudflare_tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              echo "🎉 [即時遙測中心網址] $URL"
              break
            fi
            sleep 1
          done
      - name: Run parser script
        if: ${{ github.event.inputs.repair_only != 'true' }}
        timeout-minutes: 320
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_PROXY_URL: ${{ secrets.GEMINI_PROXY_URL }}
          REFRESH_DIAGRAMS: ${{ github.event.inputs.refresh_diagrams == 'true' && 'true' || 'false' }}
          PROCESS_REPORTED_TICKETS_ONLY: ${{ github.event.inputs.process_reported_tickets_only == 'true' && 'true' || 'false' }}
        run: python catcher.py

      - name: Push Results to Google Drive
        if: always()
        run: |
          echo "⬆️ 執行完畢，開啟【三階段高優先級極速上傳】..."
          
          # =========================================================
          # === 第一階段：最高優先級！秒級上傳所有 JSON 資料庫與狀態檔 ===
          # =========================================================
          echo "⚡ [第一階段] 上傳 JSON 資料庫與狀態記憶庫..."
          rclone copy ./exam_database_output gdrive:exam_database_output \
            --include "*.json" \
            --include "*_validator_log.txt" \
            --fast-list \
            --transfers 16 \
            --checkers 32 \
            --config rclone.conf -v

          echo "📦 [第 1.5 階段] 正在將正式完成的 JSON 資料庫打包為高速單一壓縮檔 exam_databases.zip..."
          # 🚨 關鍵過濾：只納入 *_database.json，嚴格排除 *_partial_database.json 與 *_raw_extracted.json
          rm -f exam_databases.zip
          find exam_database_output -name "*_database.json" ! -name "*_partial_database.json" ! -name "*_raw_extracted.json" | zip -q -1 exam_databases.zip -@
          rclone copyto ./exam_databases.zip gdrive:exam_databases.zip \
            --drive-chunk-size 64M \
            --config rclone.conf -v
          echo "🎉 [第 1.5 階段完成] 題庫純淨正式包打包完成（已剔除所有 partial 暫存檔）！"

          for state_file in subject.json key_errors_summary.txt model_limits.json key_status.txt telemetry_history.json; do
            if [ -f "./$state_file" ]; then
              rclone copyto "./$state_file" "gdrive:$state_file" --config rclone.conf -v
            fi
          done

          echo "🎉 [第一階段完成] JSON 資料庫已 100% 安全存入雲端！"

          # =========================================================
          # === 第二階段：🚀 本地高速打包所有圖片為 exam_images.zip ===
          # =========================================================
          echo "📦 [第二階段] 正在將所有圖片高速壓縮為單一檔案 exam_images.zip..."
          # 使用 -1 (快速壓縮) 或 -0 (僅儲存)，幾秒內完成數萬張圖片打包
          zip -q -r -1 exam_images.zip exam_database_output -i "*/images/*"
          
          echo "⚡ 正在將 exam_images.zip 單一大檔高速推送至 Google Drive..."
          rclone copyto ./exam_images.zip gdrive:exam_images.zip \
            --drive-chunk-size 64M \
            --config rclone.conf -v
          echo "🎉 [第二階段完成] 圖片高速包已成功備份！下次啟動將享受秒級拉取！"

          # =========================================================
          # === 第三階段：散裝圖片背景同步 (保底增量備份) ===
          # =========================================================
          echo "🖼️ [第三階段] 散裝圖片增量同步..."
          rclone copy ./exam_database_output gdrive:exam_database_output \
            --fast-list \
            --transfers 16 \
            --checkers 32 \
            --drive-chunk-size 64M \
            --config rclone.conf -v || true

          # =========================================================
          # 🧹 [終極清理] 批次銷毀雲端暫存，並消除 Google Drive 重複同名檔案
          # =========================================================
          if [ -f "pending_cloud_purges.txt" ]; then
            echo "🧹 正在同步銷毀 Google Drive 上的舊檔與暫存..."
            sort -u pending_cloud_purges.txt | while IFS= read -r cloud_file; do
              if [ -n "$cloud_file" ]; then
                rclone deletefile "$cloud_file" --config rclone.conf --drive-use-trash=false >/dev/null 2>&1 || true
              fi
            done
            rm -f pending_cloud_purges.txt
            echo "✅ 雲端舊檔與暫存已徹底銷毀！"
          fi

          echo "🔄 [消除雲端同名副本] 正在檢測並合併 Google Drive 上的重複同名檔案..."
          rclone dedupe newest gdrive:exam_database_output --config rclone.conf -v || true
          echo "✅ 雲端同名副本已強制保留最新版本！"

          # 清除敏感金鑰與設定檔
          rm -f rclone.conf key.txt exam_images.zip exam_databases.zip

      - name: 🔄 自動接力重啟下一輪 (24hr Loop Dispatcher)
        if: always()
        env:
          AUTO_LOOP_PAT: ${{ secrets.AUTO_LOOP_PAT }}
        run: |
          echo "=========================================================="
          echo "🏁 當前梯次已完成硬碟落盤與雲端上傳！"
          echo "=========================================================="

          # 1. 檢查是否觸發人工終止信號
          if [ "${{ github.event.inputs.repair_only }}" == "true" ] || [ "${{ github.event.inputs.process_reported_tickets_only }}" == "true" ]; then
            echo "🛑 本次為單次指定維護任務 (repair_only / ticket)，不觸發自動循環接力。"
            exit 0
          fi

          if [ -z "$AUTO_LOOP_PAT" ]; then
            echo "⚠️ 未設定 secrets.AUTO_LOOP_PAT，無法自動重啟。請依照指示設定 PAT。"
            exit 0
          fi

          # 2. 短暫冷卻 30 秒（避免 GitHub API 頻率過密）
          echo "⏳ 正在等待 30 秒冷卻緩衝..."
          sleep 30

          # 3. 取得當前 workflow 檔案名稱 (通常為 catcher.yml)
          WORKFLOW_FILE=$(basename "${{ github.workflow_ref }}" | cut -d'@' -f1)
          if [ -z "$WORKFLOW_FILE" ]; then WORKFLOW_FILE="catcher.yml"; fi

          echo "🚀 正在觸發下一輪 GitHub Actions ($WORKFLOW_FILE)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer $AUTO_LOOP_PAT" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILE/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}")

          if [ "$HTTP_STATUS" -eq 204 ]; then
            echo "🎉 [接力成功] 204 No Content：下一輪 Action 已成功排入隊列，流水線將 24 小時持續運轉！"
          else
            echo "❌ [接力失敗] HTTP 代碼: $HTTP_STATUS，請檢查 PAT 是否具備 'repo' 與 'workflow' 權限。"
          fi