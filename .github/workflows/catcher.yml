name: Run Exam Parser Catcher

# 保證任何時刻只有一個 Parser 正在執行
concurrency:
  group: exam-parser-exclusive-singleton
  cancel-in-progress: false

on:
  workflow_dispatch: # 支援手動在 GitHub 網頁點擊執行
    inputs:
      repair_only:
        description: '⚡ 【秒級修復】僅執行 100+ 份資料庫離線清洗（剔除幽靈題、合併重題、升級知識點，修復後直接上傳，不跑 catcher.py）'
        required: false
        type: boolean
        default: false
      process_reported_tickets_only:
        description: '🎯 【精準重跑】僅針對使用者在網頁回報有問題的題目進行重新檢驗、重新裁圖與 AI 重解'
        required: false
        type: boolean
        default: false

      run_repair_before_parse:
        description: '🧹 【修復+續跑】先執行資料庫離線修復，再啟動 catcher.py 進行新題目解析'
        required: false
        type: boolean
        default: false
      refresh_diagrams:
        description: '🔄 是否強制重繪所有 AI 圖解 (修復舊版中文豆腐塊與細長條變形)'
        required: false
        type: boolean
        default: false

jobs:
  run-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Job 層級安全超時保護 (5.8小時)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🧹 釋放 Runner 磁碟空間 (清理非必要套件釋放 25GB)
        run: |
          echo "正在釋放 GitHub Runner 磁碟空間以容納 7GB 模擬考題庫..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies & rclone
        run: |
          # 一次性安裝中文字型、字型管理工具、curl、zip 與 unzip
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fontconfig curl zip unzip
          sudo fc-cache -fv
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai openai httpx pymupdf pymupdf4llm opencv-python-headless pillow matplotlib pydantic opencc-python-reimplemented pylatexenc rapidocr_onnxruntime pdfplumber
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Configure rclone & Gemini Keys (雙帳號多 Remote 支援)
        env:
          GEMINI_API_KEYS_ENV: ${{ secrets.GEMINI_API_KEYS }}
          GDRIVE_CLIENT_ID_ENV: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET_ENV: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_OAUTH_TOKEN_ENV: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          GDRIVE_MOCK_CLIENT_ID_ENV: ${{ secrets.GDRIVE_MOCK_CLIENT_ID }}
          GDRIVE_MOCK_CLIENT_SECRET_ENV: ${{ secrets.GDRIVE_MOCK_CLIENT_SECRET }}
          GDRIVE_MOCK_OAUTH_TOKEN_ENV: ${{ secrets.GDRIVE_MOCK_OAUTH_TOKEN }}
          GEMINI_PROXY_URL: ${{ secrets.GEMINI_PROXY_URL }}
        run: |
          # 1. 將 Gemini 金鑰寫入本地 key.txt
          printf "%s\n" "$GEMINI_API_KEYS_ENV" > key.txt
          
          # 2. 產生主帳號 rclone 設定 [gdrive]
          cat << EOF > rclone.conf
          [gdrive]
          type = drive
          client_id = $GDRIVE_CLIENT_ID_ENV
          client_secret = $GDRIVE_CLIENT_SECRET_ENV
          scope = drive
          token = $GDRIVE_OAUTH_TOKEN_ENV
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF

          # 3. 模考專用帳號直接共用原資料夾 ID (儲存配額計入模考新帳號)
          if [ -n "$GDRIVE_MOCK_OAUTH_TOKEN_ENV" ]; then
            echo "🌟 檢測到模考專用 Google 帳號，共用原 Folder ID 並啟動容量分流！"
            cat << EOF >> rclone.conf
          [gdrive_mock]
          type = drive
          client_id = $GDRIVE_MOCK_CLIENT_ID_ENV
          client_secret = $GDRIVE_MOCK_CLIENT_SECRET_ENV
          scope = drive
          token = $GDRIVE_MOCK_OAUTH_TOKEN_ENV
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF
          else
            echo "ℹ️ 未設定 GDRIVE_MOCK_OAUTH_TOKEN，模考圖片將暫存於主帳號 [gdrive]。"
          fi

      - name: Pull Workspace from Google Drive (雙軌智慧拉取模式)
        run: |
          echo "⬇️ 開始從 Google Drive 雲端同步最新進度與題庫..."
          mkdir -p gdrive_workspace
          
          # =========================================================================
          # 🚀 第一步：優先抓取根目錄的高速壓縮包與狀態檔（秒級完成核心數據恢復）
          # =========================================================================
          rclone copy gdrive: ./gdrive_workspace \
            --include "exam_databases.zip" \
            --include "exam_images.zip" \
            --include "*.zip" \
            --include "*.json" \
            --include "key_status.txt" \
            --include "key_errors_summary.txt" \
            --fast-list \
            --config rclone.conf -v || true

          # 1. ⚡ 智慧動態解壓縮所有題庫分卷 (完整支援 mock1.zip, mock2.zip, exams1.zip 等)
          # 排除資料庫與圖片快取包 (exam_databases.zip, exam_images.zip, mock_exam_images.zip)
          for zipfile in ./gdrive_workspace/*.zip; do
            [ -e "$zipfile" ] || continue
            bname=$(basename "$zipfile")
            
            # 過濾掉產出的成果包
            if [[ "$bname" != "exam_databases.zip" && "$bname" != "exam_images.zip" && "$bname" != "mock_exam_images.zip" ]]; then
              echo "📦 找到題庫壓縮分卷: $bname，正在解壓縮..."
              unzip -q -o "$zipfile" -d ./
              rm -f "$zipfile"  # 🚨 解壓完成立刻刪除壓縮包，瞬間釋放數 GB Runner 空間！
              echo "✅ $bname 解壓完成並已清除壓縮暫存！"
            fi
          done

          # 1.1 🛡️ 模擬考目錄自動防呆補位
          # 若解壓後發現根目錄散落了模考 PDF（打包時未包外層資料夾），自動歸入 mock_exam_papers_only/
          mkdir -p mock_exam_papers_only
          find . -maxdepth 1 -type f -name "*模*.pdf" -exec mv -f {} mock_exam_papers_only/ \; 2>/dev/null || true
          find . -maxdepth 1 -type f -name "*E[1-8]*.pdf" -exec mv -f {} mock_exam_papers_only/ \; 2>/dev/null || true

          # 2. ⚡ 優先解壓 exam_databases.zip 高速題庫包（瞬間恢復所有已完成的 JSON）
          mkdir -p exam_database_output
          if [ -f "./gdrive_workspace/exam_databases.zip" ]; then
            echo "⚡ 找到題庫高速包 exam_databases.zip，正在秒級解壓縮..."
            unzip -q -o "./gdrive_workspace/exam_databases.zip" -d ./
            echo "✅ 題庫資料庫已瞬間恢復完成！"
          fi

          # 3. ⚡ 優先解壓大考圖片高速包 exam_images.zip
          if [ -f "./gdrive_workspace/exam_images.zip" ]; then
            echo "⚡ 找到大考圖片高速包 exam_images.zip，正在秒級解壓縮..."
            unzip -q -o "./gdrive_workspace/exam_images.zip" -d ./
            echo "✅ 大考圖片庫已恢復完成！"
          fi

          # 3.1 ⚡ 優先從模考專用帳號拉取並解壓 mock_exam_images.zip
          MOCK_REMOTE="gdrive"
          if grep -q "\[gdrive_mock\]" rclone.conf; then MOCK_REMOTE="gdrive_mock"; fi

          echo "⬇️ 檢查並拉取模擬考專用圖片包 (${MOCK_REMOTE}:mock_exam_images.zip)..."
          rclone copyto ${MOCK_REMOTE}:mock_exam_images.zip ./gdrive_workspace/mock_exam_images.zip --config rclone.conf -v || true
          if [ -f "./gdrive_workspace/mock_exam_images.zip" ]; then
            echo "⚡ 找到模考專用圖片高速包，正在秒級解壓縮..."
            unzip -q -o "./gdrive_workspace/mock_exam_images.zip" -d ./
            echo "✅ 模考圖片庫已恢復完成！"
          fi

          # 3.2 補足雲端模考散裝圖片（使用模考帳號身分拉取）
          if [ "$MOCK_REMOTE" = "gdrive_mock" ]; then
            echo "🔄 從模考帳號增量補齊模擬考散裝圖片..."
            rclone copy gdrive_mock:exam_database_output/模擬考 ./exam_database_output/模擬考 \
              --fast-list --transfers 16 --checkers 32 --config rclone.conf -v || true
          fi

          # =========================================================================
          # 🔄 第二步：啟動「增量補足機制」，透過 rclone 確保雲端上任何殘留的 partial、
          #           新生成的散裝 JSON 或漏掉的圖片能被精準補齊到本地工作區
          # =========================================================================
          echo "🔄 正在從雲端增量同步並補足任何散裝、partial 檔案..."
          rclone copy gdrive:exam_database_output ./exam_database_output \
            --fast-list \
            --transfers 16 \
            --checkers 32 \
            --config rclone.conf -v || true
          
          # 4. 精準還原知識庫與狀態記憶庫
          cp -f ./gdrive_workspace/subject.json ./subject.json 2>/dev/null || true
          cp -f ./gdrive_workspace/key_errors_summary.txt ./key_errors_summary.txt 2>/dev/null || true
          cp -f ./gdrive_workspace/model_limits.json ./model_limits.json 2>/dev/null || true
          cp -f ./gdrive_workspace/key_status.txt ./key_status.txt 2>/dev/null || true
          cp -f ./gdrive_workspace/telemetry_history.json ./telemetry_history.json 2>/dev/null || true
          cp -f ./gdrive_workspace/scheduler_state.json ./scheduler_state.json 2>/dev/null || true
          if [ ! -f "./model_limits.json" ]; then echo "{}" > ./model_limits.json; fi
          if [ ! -f "./scheduler_state.json" ]; then echo "{\"mock_streak\": 0}" > ./scheduler_state.json; fi

      - name: 🛠️ 執行資料庫離線無損修復與重漏題仲裁
        run: |
          echo "=========================================================="
          echo "🚀 啟動 100+ 份試卷資料庫離線無損修復引擎 (Zero-API Cost)..."
          echo "=========================================================="
          # 🚨 預先清理 Google Drive 下載產生的 .1.json / .2.json 同名衝突副本
          find ./exam_database_output -name "*_database.*.json" -type f -delete
          python repair_database.py
          find ./exam_database_output -name "*.bak" -type f -delete
          echo "✅ 資料庫洗淨與修復完畢，已就緒！"

      - name: 🌐 啟動 Cloudflare Tunnel 即時儀表板穿透
        if: ${{ github.event.inputs.repair_only != 'true' }}
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb && rm cloudflared.deb
          
          # 背景啟動穿透通道，對接本機 8080 遙測儀表板
          cloudflared tunnel --url http://127.0.0.1:8080 > cloudflare_tunnel.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' cloudflare_tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              echo "🎉 [即時遙測中心網址] $URL"
              break
            fi
            sleep 1
          done
      - name: Run parser script
        if: ${{ github.event.inputs.repair_only != 'true' }}
        timeout-minutes: 320
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_PROXY_URL: ${{ secrets.GEMINI_PROXY_URL }}
          REFRESH_DIAGRAMS: ${{ github.event.inputs.refresh_diagrams == 'true' && 'true' || 'false' }}
          PROCESS_REPORTED_TICKETS_ONLY: ${{ github.event.inputs.process_reported_tickets_only == 'true' && 'true' || 'false' }}
        run: python catcher.py

      - name: Push Results to Google Drive
        if: always()
        run: |
          echo "⬆️ 執行完畢，開啟【三階段高優先級極速上傳】..."
          
          # =========================================================
          # === 第一階段：最高優先級！秒級上傳所有 JSON 資料庫與狀態檔 ===
          # =========================================================
          echo "⚡ [第一階段] 上傳 JSON 資料庫與狀態記憶庫..."
          rclone copy ./exam_database_output gdrive:exam_database_output \
            --include "*.json" \
            --include "*_validator_log.txt" \
            --fast-list \
            --transfers 16 \
            --checkers 32 \
            --config rclone.conf -v

          echo "📦 [第 1.5 階段] 正在將正式完成的 JSON 資料庫打包為高速單一壓縮檔 exam_databases.zip..."
          # 🚨 關鍵過濾：只納入 *_database.json，嚴格排除 *_partial_database.json 與 *_raw_extracted.json
          rm -f exam_databases.zip
          find exam_database_output -name "*_database.json" ! -name "*_partial_database.json" ! -name "*_raw_extracted.json" | zip -q -1 exam_databases.zip -@
          rclone copyto ./exam_databases.zip gdrive:exam_databases.zip \
            --drive-chunk-size 64M \
            --config rclone.conf -v
          echo "🎉 [第 1.5 階段完成] 題庫純淨正式包打包完成（已剔除所有 partial 暫存檔）！"

          for state_file in subject.json key_errors_summary.txt model_limits.json key_status.txt telemetry_history.json scheduler_state.json; do
            if [ -f "./$state_file" ]; then
              rclone copyto "./$state_file" "gdrive:$state_file" --config rclone.conf -v
            fi
          done

          echo "🎉 [第一階段完成] JSON 資料庫已 100% 安全存入雲端！"

          # =========================================================
          # === 第二階段：🚀 雙軌分離高速打包 (大考圖片包 vs 模考專屬圖片包) ===
          # =========================================================
          MOCK_REMOTE="gdrive"
          if grep -q "\[gdrive_mock\]" rclone.conf; then MOCK_REMOTE="gdrive_mock"; fi

          # A. 打包「學測、分科、指考、學校定期考」圖片為 exam_images.zip (100% 排除模擬考)
          echo "📦 [第二階段 A] 正在打包大考與段考圖片包 exam_images.zip (排除所有模擬考圖片)..."
          rm -f exam_images.zip
          find exam_database_output -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" \) ! -path "*/模擬考/*" 2>/dev/null | zip -q -1 exam_images.zip -@ || true

          if [ -f "exam_images.zip" ]; then
            echo "⚡ 正在將大考圖片包推送至主帳號 (gdrive:exam_images.zip)..."
            rclone copyto ./exam_images.zip gdrive:exam_images.zip \
              --drive-chunk-size 64M \
              --config rclone.conf -v
          fi

          # B. 滴水不漏打包「模擬考」所有圖片為 mock_exam_images.zip (強制由模考專用帳號儲存)
          echo "📦 [第二階段 B] 正在打包模考專用圖片包 mock_exam_images.zip (包含題目圖、選項圖、詳解圖)..."
          rm -f mock_exam_images.zip
          find exam_database_output/模擬考 -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.webp" \) 2>/dev/null | zip -q -1 mock_exam_images.zip -@ || true

          if [ -f "mock_exam_images.zip" ]; then
            echo "⚡ 正在將模考圖片包推送至專用帳號 (${MOCK_REMOTE}:mock_exam_images.zip)..."
            # 🚨 以 MOCK_REMOTE 身份上傳，配額 100% 計入模考新帳號！
            rclone copyto ./mock_exam_images.zip ${MOCK_REMOTE}:mock_exam_images.zip \
              --drive-chunk-size 64M \
              --config rclone.conf -v
          fi
          echo "🎉 [第二階段完成] 圖片雙軌分流打包備份完畢！"

          # =========================================================
          # === 第三階段：散裝圖片分流同步 (保底增量備份) ===
          # =========================================================
          echo "🖼️ [第三階段] 散裝圖片雙軌增量同步..."
          # 主帳號增量備份 (100% 排除模擬考)
          rclone copy ./exam_database_output gdrive:exam_database_output \
            --exclude "模擬考/**" \
            --fast-list --transfers 16 --checkers 32 --drive-chunk-size 64M \
            --config rclone.conf -v || true

          # 模考專用帳號增量備份 (🚨 100% 使用 MOCK_REMOTE 身分上傳模擬考所有產出圖片)
          if [ -d "./exam_database_output/模擬考" ]; then
            echo "🖼️ 使用模考專用帳號身分 (${MOCK_REMOTE}) 同步模擬考所有圖片..."
            rclone copy ./exam_database_output/模擬考 ${MOCK_REMOTE}:exam_database_output/模擬考 \
              --include "*.png" --include "*.jpg" --include "*.jpeg" --include "*.webp" \
              --fast-list --transfers 16 --checkers 32 --drive-chunk-size 64M \
              --config rclone.conf -v || true
          fi

          # =========================================================
          # 🧹 [終極清理] 批次銷毀雲端暫存，並消除 Google Drive 重複同名檔案
          # =========================================================
          if [ -f "pending_cloud_purges.txt" ]; then
            echo "🧹 正在同步銷毀 Google Drive 上的舊檔與暫存..."
            sort -u pending_cloud_purges.txt | while IFS= read -r cloud_file; do
              if [ -n "$cloud_file" ]; then
                rclone deletefile "$cloud_file" --config rclone.conf --drive-use-trash=false >/dev/null 2>&1 || true
                if [ "$MOCK_REMOTE" = "gdrive_mock" ]; then
                  mock_cloud_file=$(echo "$cloud_file" | sed 's/^gdrive:/gdrive_mock:/')
                  rclone deletefile "$mock_cloud_file" --config rclone.conf --drive-use-trash=false >/dev/null 2>&1 || true
                fi
              fi
            done
            rm -f pending_cloud_purges.txt
            echo "✅ 雲端舊檔與暫存已徹底銷毀！"
          fi

          echo "🔄 [消除雲端同名副本] 正在檢測並合併 Google Drive 上的重複同名檔案..."
          rclone dedupe newest gdrive:exam_database_output --config rclone.conf -v || true
          echo "✅ 雲端同名副本已強制保留最新版本！"

          # 清除敏感金鑰與設定檔
          rm -f rclone.conf key.txt exam_images.zip mock_exam_images.zip exam_databases.zip

      - name: 🔄 自動接力重啟下一輪 (24hr Loop Dispatcher)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AUTO_LOOP_PAT }}
        run: |
          echo "=========================================================="
          echo "🏁 當前梯次已完成硬碟落盤與雲端上傳！"
          echo "=========================================================="

          # 1. 檢查是否為單次維護指令
          if [ "${{ github.event.inputs.repair_only }}" == "true" ] || [ "${{ github.event.inputs.process_reported_tickets_only }}" == "true" ]; then
            echo "🛑 本次為指定維護任務，不觸發自動循環接力。"
            exit 0
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "⚠️ 未設定 secrets.AUTO_LOOP_PAT，無法自動重啟。"
            exit 0
          fi

          # 2. 等待 30 秒冷卻緩衝
          echo "⏳ 正在等待 30 秒冷卻緩衝..."
          sleep 30

          echo "🚀 正在觸發下一輪 GitHub Actions (catcher.yml)..."
          
          # 🚨 使用 GitHub 官方 CLI 觸發，具備自動錯誤回顯
          if gh workflow run catcher.yml --ref "${{ github.ref_name }}"; then
            echo "🎉 [接力成功] 下一輪 Action 已成功排入隊列，流水線將持續運轉！"
          else
            echo "⚠️ [gh 指令回傳異常，嘗試以 REST API 偵錯呼叫]..."
            curl -i -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/catcher.yml/dispatches" \
              -d "{\"ref\":\"${{ github.ref_name }}\"}"
          fi