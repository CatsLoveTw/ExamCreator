name: Run Exam Parser Catcher

on:
  schedule:
    # 每天 07:00 與 19:00 各執行一次（台灣時間下午3點與凌晨3點）
    - cron: '0 7,19 * * *'
  workflow_dispatch: # 手動強制執行
    inputs:
      refresh_diagrams:
        description: '🔄 是否強制重繪所有 AI 圖解 (修復舊版中文豆腐塊與細長條變形)'
        required: false
        type: boolean
        default: false # 🚨 修正 1：預設改為 false，只有手動勾選時才重繪

jobs:
  run-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Job 層級安全超時保護 (5.8小時)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies & rclone
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk curl unzip
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure rclone
        env:
          GEMINI_API_KEYS_ENV: ${{ secrets.GEMINI_API_KEYS }}
          GDRIVE_OAUTH_TOKEN_ENV: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
        run: |
          printf "%s" "$GEMINI_API_KEYS_ENV" > key.txt
          
          cat << EOF > rclone.conf
          [gdrive]
          type = drive
          scope = drive
          token = $GDRIVE_OAUTH_TOKEN_ENV
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF

      - name: Pull Workspace from Google Drive
        run: |
          echo "⬇️ 開始從 Google Drive 雲端同步最新進度與題庫..."
          mkdir -p gdrive_workspace
          rclone sync gdrive: ./gdrive_workspace --config rclone.conf -v

          # 1. 解壓縮題庫檔案 (exams.zip, mock.zip, full.zip, school.zip)
          for zipfile in exams.zip mock.zip full.zip school.zip; do
            if [ -f "./gdrive_workspace/$zipfile" ]; then
              echo "📦 找到 $zipfile，正在解壓縮..."
              unzip -q -o "./gdrive_workspace/$zipfile" -d ./
            fi
          done

          # 2. 檢查解壓後的題庫資料夾列表
          echo "🔍 檢查解壓後的題庫資料夾列表："
          ls -d *_exam_papers_only 2>/dev/null || echo "⚠️ 警告：未找到任何 *_exam_papers_only 題庫資料夾"

          # 3. 🚨 修正 2：完整複製歷史解析結果（含 .done 與 .failed 標記檔）
          mkdir -p exam_database_output
          if [ -d "./gdrive_workspace/exam_database_output" ]; then
            cp -a ./gdrive_workspace/exam_database_output/. ./exam_database_output/ 2>/dev/null || true
          fi
          
          # 4. 🚨 修正 3：精準還原知識庫、金鑰錯誤日誌與【模型 Token 上限記憶庫】
          cp -f ./gdrive_workspace/subject.json ./subject.json 2>/dev/null || true
          cp -f ./gdrive_workspace/key_errors_summary.txt ./key_errors_summary.txt 2>/dev/null || true
          cp -f ./gdrive_workspace/model_limits.json ./model_limits.json 2>/dev/null || true
          cp -f ./gdrive_workspace/key_status.txt ./key_status.txt 2>/dev/null || true

          # 若雲端尚無 model_limits.json，則初始化一個空 JSON，確保後續必能上傳
          if [ ! -f "./model_limits.json" ]; then
            echo "{}" > ./model_limits.json
          fi

      - name: Run parser script
        timeout-minutes: 320 # 給予腳本最多 5.3 小時
        env:
            GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
            OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
            REFRESH_DIAGRAMS: ${{ github.event.inputs.refresh_diagrams == 'true' && 'true' || 'false' }}
        run: python catcher.py

      - name: Push Results to Google Drive
        if: always() # 🚨 保證即使 Python 超時被終止，也必定執行上傳！
        run: |
          echo "⬆️ 執行完畢，開啟【兩階段高優先級極速上傳】..."
          
          # =========================================================
          # === 第一階段：最高優先級！上傳所有 JSON、文字日誌與記憶檔 ===
          # =========================================================
          echo "⚡ [第一階段] 優先上傳 JSON 資料庫與狀態檔案..."
          rclone copy ./exam_database_output gdrive:exam_database_output \
            --include "*.json" \
            --include "*_validator_log.txt" \
            --fast-list \
            --size-only \
            --transfers 16 \
            --checkers 32 \
            --config rclone.conf -v

          # 備份根目錄關鍵日誌、金鑰儀表板與【模型 Token 上限記憶庫】
          for state_file in subject.json key_errors_summary.txt model_limits.json key_status.txt; do
            if [ -f "./$state_file" ]; then
              rclone copyto "./$state_file" "gdrive:$state_file" --config rclone.conf -v
              echo "✅ $state_file 已成功備份至雲端！"
            fi
          done

          echo "🎉 [第一階段完成] 所有 JSON 資料庫與狀態檔已 100% 安全存入 Google Drive！"

          # =========================================================
          # === 第二階段：圖片與繪圖標記檔 (.done / .failed) 極速同步 ===
          # =========================================================
          echo "🖼️ [第二階段] 同步圖片與標記檔..."
          rclone copy ./exam_database_output gdrive:exam_database_output \
            --fast-list \
            --size-only \
            --transfers 16 \
            --checkers 32 \
            --drive-chunk-size 64M \
            --config rclone.conf -v

          # 清除敏感金鑰與暫存
          rm -f rclone.conf key.txt